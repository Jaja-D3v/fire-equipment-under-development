<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/chemical-spill-kit-inventory.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;font-family:Arial,sans-serif}.inspection-page{padding:24px;max-width:100%;overflow-x:clip}.inspection-table-card{background:#fff;border:1px solid #e7edf7;border-radius:18px}.inspection-table{border-collapse:collapse;min-width:900px}.inspection-table th,.inspection-table td{vertical-align:middle}.inspection-table th{white-space:nowrap}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap}.btn-primary{background:#0d6efd;color:#fff}.btn-success{background:#198754;color:#fff}.csk-inventory-footer{padding:16px;display:flex;justify-content:space-between;gap:12px}.csk-inventory-pagination{display:flex;gap:5px}.inspection-page-btn{display:inline-grid;place-items:center;min-width:32px;height:32px;border:1px solid #d9e3f2;border-radius:7px}.table-responsive{width:100%}#result{margin:12px 24px;white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><main class="inspection-page csk-inventory-page"><section class="inspection-table-card csk-inventory-table-card csk-archived-table-card"><div class="table-responsive csk-archived-table-scroll" id="table-wrapper"><table class="inspection-table csk-archived-table"><thead><tr><th>CSK Code</th><th>Location</th><th>Branch</th><th>Last Date Inspected</th><th>Actions</th></tr></thead><tbody><tr><td>CSK-001</td><td>Chemical Storage and Hazardous Materials Area</td><td>Laguna Branch</td><td>Nov 19, 2026</td><td><div class="csk-archived-actions"><button class="btn btn-primary">View Details</button><form><button class="btn btn-success">Restore</button></form></div></td></tr></tbody></table></div><div class="csk-inventory-footer" id="pagination"><span>Showing 1–1 of 1 archived kits</span><nav class="csk-inventory-pagination"><span class="inspection-page-btn">1</span><span class="inspection-page-btn">2</span><span class="inspection-page-btn">3</span></nav></div></section></main><pre id="result"></pre><script>
addEventListener('load',()=>{const w=document.querySelector('#table-wrapper'),t=document.querySelector('table'),a=[...document.querySelectorAll('.csk-archived-actions button')],h=[...document.querySelectorAll('thead th')],cells=[...document.querySelectorAll('tbody td')],p=document.querySelector('#pagination'),root=document.documentElement,needsScroll=w.scrollWidth>w.clientWidth+1;w.scrollLeft=w.scrollWidth;const wr=w.getBoundingClientRect(),actions=a.every(x=>{const r=x.getBoundingClientRect();return r.left>=wr.left-1&&r.right<=wr.right+1}),headersAligned=h.length===cells.length&&h.every((x,i)=>Math.abs(x.getBoundingClientRect().left-cells[i].getBoundingClientRect().left)<=1),result={viewport:[innerWidth,innerHeight],tableWidth:Math.round(t.getBoundingClientRect().width),wrapperWidth:Math.round(wr.width),pageOverflow:root.scrollWidth<=innerWidth+1,wrapperWithinPage:wr.left>=-1&&wr.right<=innerWidth+1,desktopHasNoScroll:innerWidth<1200||!needsScroll,smallViewportScrollIsContained:innerWidth>=1200||!needsScroll||w.scrollWidth>w.clientWidth,actionsAccessible:actions,headersAligned,paginationWithinPage:p.getBoundingClientRect().right<=innerWidth+1};document.querySelector('#result').textContent=JSON.stringify(result);document.title=Object.values(result).filter(x=>typeof x==='boolean').every(Boolean)?'PASS':'FAIL'});
</script></body></html>
